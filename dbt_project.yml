name: my_dbt_project
version: '1.0'
config-version: 2

profile: my_dbt_profile

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

models:
  my_dbt_project:
    staging:
      +schema: staging
      +database: data_vault
    xts:
      +schema: xts
      +database: data_vault
    satellite:
      +schema: satellite
      +database: data_vault
    data_mart:
      +schema: data_mart
      +database: data_vault
    dm_model:
      +database: dm_model
      dim:
        +schema: dim
      dact:
        +schema: dact